name: Validate examples

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Offline syntax validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Create isolated Python environment
        run: python3 -m venv /tmp/example-validation

      - name: Install pinned YAML parser
        run: >-
          /tmp/example-validation/bin/python -m pip install
          --disable-pip-version-check
          --no-cache-dir
          --only-binary=:all:
          PyYAML==6.0.2

      - name: Validate repository examples
        run: /tmp/example-validation/bin/python scripts/validate_repository.py
